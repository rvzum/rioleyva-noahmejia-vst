# Builds the Windows and macOS installers for RIO LEYVA x NOAH MEJIA VST and
# publishes both as a GitHub Release, so anyone with the link (or the file
# itself, once downloaded and forwarded) can install the plugin without
# needing to build it themselves.
#
# There is no Windows machine in this project's normal dev environment (only
# a Mac), so the Windows build/installer only ever happens here, on
# GitHub's windows-latest runner. The macOS build mirrors what
# Scripts/build_installer.sh already does locally -- see
# Packaging/README.md for the full story on both installers being
# UNSIGNED (no Apple Developer ID / no Windows code-signing certificate
# yet), which is why first launch shows a one-time Gatekeeper /
# SmartScreen warning on the receiving machine.
#
# SAMPLE BANKS: both installers try to bundle the ~2GB sample library too
# (see Scripts/upload_samples.sh / Packaging/README.md for the one-time
# manual step of uploading them as assets on a "samples" GitHub Release).
# If that "samples" release doesn't exist yet (or has no assets), both
# jobs fall back to building a plugin-only installer instead of failing --
# so this workflow works from the very first push, before samples have
# ever been uploaded.
name: Build installers

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (background video -> frame extraction, used by CMakeLists.txt)
        run: choco install ffmpeg -y

      - name: Read project version from CMakeLists.txt
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(27wavVST VERSION ([0-9.]+)' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if (-not $ver) { throw "Could not read project version from CMakeLists.txt" }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Configure (Release, x64)
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target 27wavVST_VST3 --parallel

      - name: Locate built .vst3 bundle
        id: locate
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path "build\27wavVST_artefacts" -Recurse -Directory -Filter "*.vst3" |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $dir) { throw "Could not find a built .vst3 bundle under build\27wavVST_artefacts" }
          echo "vst3dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Download sample banks (optional -- only if uploaded to the "samples" release)
        id: samples
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "samples-src" | Out-Null
          $downloaded = $false
          try {
            gh release download samples --repo "${{ github.repository }}" --dir samples-src --pattern "*.zip" --clobber
            if ($LASTEXITCODE -eq 0 -and (Get-ChildItem samples-src -Filter *.zip -ErrorAction SilentlyContinue).Count -gt 0) {
              $downloaded = $true
            }
          } catch {
            Write-Host "No 'samples' release found (or no assets) -- building plugin-only installer."
          }
          if ($downloaded) {
            Get-ChildItem samples-src -Filter *.zip | ForEach-Object {
              Expand-Archive -Path $_.FullName -DestinationPath "samples-src" -Force
              Remove-Item $_.FullName
            }
            echo "dir=$((Resolve-Path 'samples-src').Path)" >> $env:GITHUB_OUTPUT
          } else {
            echo "dir=" >> $env:GITHUB_OUTPUT
          }

      - name: Locate Inno Setup (install if missing)
        id: inno
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still not found after install" }
          echo "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Packaging\build" | Out-Null
          $isccArgs = @(
            "Packaging\windows\installer.iss",
            "/DAppVersion=${{ steps.version.outputs.version }}",
            "/DSourceVst3Dir=${{ steps.locate.outputs.vst3dir }}",
            "/O`"Packaging\build`"",
            "/F`"RIO LEYVA x NOAH MEJIA VST Installer`""
          )
          if ("${{ steps.samples.outputs.dir }}" -ne "") {
            $isccArgs += "/DSourceSamplesDir=${{ steps.samples.outputs.dir }}"
          }
          & "${{ steps.inno.outputs.iscc }}" @isccArgs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Packaging/build/*.exe

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (background video -> frame extraction, used by CMakeLists.txt)
        run: brew install ffmpeg

      - name: Download sample banks (optional -- only if uploaded to the "samples" release)
        id: samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples-src
          if gh release download samples --repo "${{ github.repository }}" --dir samples-src --pattern "*.zip" --clobber; then
            if ls samples-src/*.zip >/dev/null 2>&1; then
              for z in samples-src/*.zip; do
                unzip -q -o "$z" -d samples-src
                rm -f "$z"
              done
              echo "dir=$(pwd)/samples-src" >> "$GITHUB_OUTPUT"
            else
              echo "dir=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No 'samples' release found -- building plugin-only installer."
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + package .pkg (Scripts/build_installer.sh)
        env:
          W27_SAMPLES_DIR: ${{ steps.samples.outputs.dir }}
        run: |
          chmod +x Scripts/build_installer.sh
          ./Scripts/build_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: Packaging/build/*.pkg

  publish-release:
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish a rolling "latest" release with both installers attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: "true"
          body: |
            Automatically built by GitHub Actions from the latest push to main.

            When a "samples" release with the uploaded sample-bank zips
            exists in this repo, both installers below bundle the sample
            banks too (installed machine-wide, shared by every DAW/user on
            the receiving computer); otherwise they install the plugin
            only. Either way, both installers are UNSIGNED (no Apple
            Developer ID / Windows code-signing certificate) -- the first
            launch on the receiving machine shows a one-time Gatekeeper
            (macOS) or SmartScreen (Windows) warning. See
            Packaging/README.md in the repo for exactly what to tell
            whoever you send this to.
          files: |
            dist/windows-installer/*.exe
            dist/macos-installer/*.pkg
